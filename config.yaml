# Cauliflower Disease Classification Training Configuration

# Dataset Configuration
data:
  csv_file: "dataset_labels.csv"
  dataset_root: "dataset"
  val_split: 0.15
  test_split: 0.15
  img_size: 224
  num_workers: 4

# Model Configuration
model:
  architecture: "efficientnet_b0"  # Options: efficientnet_b0, resnet50, mobilenet_v3
  pretrained: true

# Training Configuration
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  use_focal_loss: false
  use_amp: true  # Automatic Mixed Precision for faster training
  save_dir: "checkpoints"
  random_seed: 42

# Optimizer Configuration
optimizer:
  type: "AdamW"
  betas: [0.9, 0.999]
  eps: 1e-8

# Scheduler Configuration
scheduler:
  type: "CosineAnnealingLR"
  T_max: 50
  eta_min: 1e-6

# Augmentation Configuration
augmentation:
  train:
    random_crop: true
    horizontal_flip: 0.5
    vertical_flip: 0.3
    rotation: 20
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1
  val:
    resize_only: true

# Hardware Configuration
hardware:
  device: "cuda"  # Will auto-detect NVIDIA T600
  mixed_precision: true

